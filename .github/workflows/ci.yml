name: CI

on:
  push:
  pull_request:

jobs:
  install-smoke:
    name: Install / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build distributable wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Verify clean installation outside checkout
        run: python scripts/verify_wheel_install.py --wheel-dir dist --output install-smoke.json
      - name: Upload sanitized installation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-smoke-${{ matrix.os }}
          path: install-smoke.json
          if-no-files-found: warn
          retention-days: 7

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -e ".[dev,server]"

      - name: Set up Node.js
        if: matrix.python-version == '3.11'
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: |
            console_web/package-lock.json

      - name: Verify Console frontend bundle
        if: matrix.python-version == '3.11'
        run: |
          npm --prefix console_web ci --ignore-scripts
          npm --prefix console_web test
          npx --prefix console_web playwright install --with-deps chromium
          npm --prefix console_web run test:e2e
          npm --prefix console_web run build
          git diff --exit-code -- aitest_kit/console/web

      - name: Upload Console Playwright diagnostics
        if: failure() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: console-playwright-diagnostics
          path: |
            console_web/test-results
            console_web/e2e/__screenshots__
          if-no-files-found: ignore
          retention-days: 7

      - name: Compile package
        run: python -m compileall aitest_kit

      - name: Run unit tests
        run: python -m pytest tests -q

      - name: Validate codegen profiles
        run: python -m aitest_kit.cli codegen --all --validate-profile

      - name: Check generated pytest freshness
        run: python -m aitest_kit.cli codegen --all --check

      - name: Collect generated pytest
        run: python -m pytest test_workspace/generated --collect-only -q

      - name: Initialize empty workspace
        run: |
          python -m aitest_kit.cli init --target /tmp/aitest_ci_project
          python -m aitest_kit.cli doctor --workspace /tmp/aitest_ci_project

      - name: Build wheel and sdist
        run: python -m build --no-isolation

      - name: Inspect release artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import runpy
          import tarfile
          import zipfile

          wheel = next(Path("dist").glob("aitest_kit-*.whl"))
          sdist = next(Path("dist").glob("aitest_kit-*.tar.gz"))
          verify_archive = runpy.run_path("scripts/verify_wheel_install.py")["verify_archive"]
          verify_archive(wheel)
          verify_archive(sdist)
          forbidden = ("coupon_system", "ab_experiment_sdk", "discount_system")
          required = (
              "aitest_kit/console/web/index.html",
              "aitest_kit/templates/project_workspace/README.md",
              "aitest_kit/templates/project_workspace/AGENTS.md",
              "aitest_kit/templates/project_workspace/CLAUDE.md",
              "aitest_kit/templates/project_workspace/skills/README.md",
              "aitest_kit/templates/project_workspace/skills/test-codegen/SKILL.md",
          )

          with zipfile.ZipFile(wheel) as zf:
              wheel_names = zf.namelist()
          missing = [name for name in required if name not in wheel_names]
          if missing:
              raise SystemExit(f"wheel missing template files: {missing}")
          console_assets = [
              name for name in wheel_names
              if name.startswith("aitest_kit/console/web/assets/")
              and name.endswith((".css", ".js"))
          ]
          if not console_assets:
              raise SystemExit("wheel missing Console frontend assets")
          leaked = [name for name in wheel_names if any(item in name for item in forbidden)]
          if leaked:
              raise SystemExit(f"wheel includes forbidden target assets: {leaked[:10]}")
          if not wheel.name.endswith("py3-none-any.whl"):
              raise SystemExit(f"wheel is not a universal pure-Python artifact: {wheel.name}")

          with tarfile.open(sdist) as tf:
              sdist_names = tf.getnames()
          leaked = [name for name in sdist_names if any(item in name for item in forbidden)]
          if leaked:
              raise SystemExit(f"sdist includes forbidden target assets: {leaked[:10]}")
          PY
